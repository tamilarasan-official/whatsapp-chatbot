# Optional: use with Dokploy "Docker Compose" deployments or locally with `docker compose up --build`.
# Set OPENAI_API_KEY in Dokploy's Environment tab (or a local .env file); never commit it.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-8000}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      PORT: 3000
    ports:
      - "3000"
