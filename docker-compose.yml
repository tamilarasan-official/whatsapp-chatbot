# Dokploy "Docker Compose" deployment: two services, two domains.
#
#   https://valardemo.welocalhost.com     -> frontend (nginx, chat UI)        container port 3000
#   https://apivalardemo.welocalhost.com  -> backend  (Express API + OpenAI)  container port 3000
#
# - Domains are configured in Dokploy > Domains (service frontend / backend, port 3000, HTTPS).
#   Dokploy adds the Traefik labels and network at deploy time, so none are hard-coded here.
# - Secrets: set OPENAI_API_KEY in Dokploy > Environment. Dokploy writes it to a .env file next to
#   this compose file, and the ${...} references below pass it in. Never commit it.
# - Local test: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: ${API_BASE_URL:-https://apivalardemo.welocalhost.com}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # HF_TOKEN (read-only) downloads the search model during the build; it is not stored in the image.
      secrets:
        - hf_token
    restart: unless-stopped
    init: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in Dokploy > Environment}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-10000}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Only the frontend domain may call the API from a browser.
      CORS_ORIGIN: ${CORS_ORIGIN:-https://valardemo.welocalhost.com}
      SERVE_STATIC: "false"
      PORT: 3000
      NODE_ENV: production
      # ---- WhatsApp Cloud API (all optional: without them the channel runs in dry-run mode) ----
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v22.0}
      PUBLIC_ASSETS_BASE: ${PUBLIC_ASSETS_BASE:-https://valardemo.welocalhost.com/assets}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      HANDOVER_WEBHOOK_URL: ${HANDOVER_WEBHOOK_URL:-}
      WHATSAPP_TEMPLATE_COMPLAINT_UPDATE: ${WHATSAPP_TEMPLATE_COMPLAINT_UPDATE:-}
      STATE_DIR: /app/runtime
    volumes:
      # Session profiles (language, STOP opt-outs, complaints registered on WhatsApp). Survives redeploys.
      - wa-state:/app/runtime
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # The API writes only to the wa-state volume, so the rest of the filesystem can be read-only.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G   # search model + index use ~500 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  hf_token:
    environment: HF_TOKEN

volumes:
  wa-state:
